name: Falla · Bug
description: Taller respondió distinto de lo esperado. / Taller did not behave as expected.
labels: ["falla"]
body:
  - type: dropdown
    id: herramienta
    attributes:
      label: Herramienta · Tool
      options: [Claude Code, Codex CLI, ChatGPT Work (Codex), ChatGPT (archivo pegado), Claude.ai, Cursor, Otra]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de Taller · Taller version
      placeholder: "1.3.0"
    validations:
      required: true
  - type: textarea
    id: pedido
    attributes:
      label: Pedido exacto · Exact prompt
    validations:
      required: true
  - type: textarea
    id: respuesta
    attributes:
      label: Respuesta obtenida · What you got
      description: Pegá la respuesta o adjuntá una captura.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas · What you expected
    validations:
      required: true
