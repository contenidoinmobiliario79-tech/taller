name: Validar Taller

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar PyYAML
        run: pip install pyyaml
      - name: Regenerar el archivo para pegar y comprobar que está al día
        run: |
          bash scripts/generar-chatgpt.sh
          git diff --exit-code dist/taller-chatgpt.md
      - name: Correr tests/validar.sh
        run: bash tests/validar.sh
